<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>إدارة المنتجات — SphinxPack</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#eef1f5;--card:#fff;--border:#e4e7ec;--text:#1f2430;--muted:#6b7280;--blue:#2f6fed;--green:#1e9e4e;--red:#e0455a;--dark:#151d2e}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text)}
  .hidden{display:none!important}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
  h1{font-size:20px;margin:0}
  h2{font-size:16px;margin:0 0 14px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d7dce3;border-radius:8px;font:inherit;font-size:14px;background:#fff}
  textarea{min-height:70px;resize:vertical}
  .field{margin-bottom:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:11px 18px;font-weight:700;font-size:14px}
  .btn-dark{background:var(--dark);color:#fff}
  .btn-light{background:#e9ecf1;color:var(--text)}
  .btn-red{background:transparent;color:var(--red);padding:6px 10px}
  .err{color:var(--red);font-size:13px;margin:8px 0;min-height:18px}
  .login{max-width:380px;margin:12vh auto}
  .preview{width:70px;height:70px;border:1px dashed #ccd;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);overflow:hidden;margin-top:8px}
  .preview img{width:100%;height:100%;object-fit:cover}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:500}
  .thumb{width:42px;height:42px;border-radius:6px;overflow:hidden;background:#f1f3f6}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .pill{padding:3px 10px;border-radius:99px;font-size:12px}
  .ok{background:#dcf5e3;color:var(--green)} .low{background:#fde3e6;color:var(--red)}
  .scroll{overflow-x:auto}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
  #toast.show{opacity:1}
  .banner{background:#fde3e6;color:var(--red);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
</style>

<style id="sphinxpack-navy-gold-v6">

/* SphinxPack Navy & Gold visual refresh v5 — CSS only */
:root{--paper:#0b1423;--paper-2:#101d30;--ink:#e9edf4;--ink-2:#13233a;--kraft:#d8b56b;--kraft-dark:#e5c77f;--signal:#d6ad59;--signal-dark:#b88c3e;--line:#263b57;--text:#e9edf4;--text-soft:#aebbd0;--white:#14243a;--danger:#ff7777;--success:#70d6a1;--radius-s:12px;--radius-m:18px;--shadow:0 18px 48px rgba(0,0,0,.35);--wa:#25D366}
html{scroll-behavior:smooth} body{background:var(--paper)!important;color:var(--text)!important} h1,h2,h3,h4{color:#f4f6fa} a{color:inherit}
.wrap{max-width:1200px}
.topbar{background:#060d18;color:#d8b56b;border-bottom:1px solid #243650}.topbar a{color:#d8b56b}
header.site-header,header{background:rgba(7,16,29,.96)!important;color:#f4f6fa;border-bottom:1px solid #b99550!important;backdrop-filter:blur(14px)}
.nav-row,.nav{padding-top:14px;padding-bottom:14px}
.logo .mark,.logo-mark{background:linear-gradient(145deg,#f0d58f,#a77d35)!important;color:#111b2b!important;border-radius:14px}
.logo .brand,.logo-text strong{color:#f1d28b!important}.logo .brand small,.logo-text em{color:#b9c6d8!important}
nav.cat-nav{background:#0e1b2e;border-top:1px solid #20334e}nav.cat-nav a{color:#c5cfdd}nav.cat-nav a:hover,nav.cat-nav a.active{color:#f0d28a;border-bottom-color:#d6ad59}
.cart-btn{background:linear-gradient(135deg,#e4c477,#b98e43)!important;color:#101a29!important;border-radius:12px;box-shadow:0 7px 18px #0005}.cart-btn .count{background:#101a29;color:#f3d58d}
.hero{background:radial-gradient(ellipse at 15% 30%,#1b3554 0%,#0b1423 58%,#08111e 100%)!important;color:#f5f6f8;border-bottom:1px solid #263b57}
.hero h1{color:#f6f7fa}.hero h1 em{color:#e5c477}.hero p,.section-head p{color:#b5c2d4}
.eyebrow{color:#e3c477}.eyebrow:before{background:#d6ad59}
.hero-logo-panel{background:linear-gradient(145deg,#1b2e49,#0b1423)!important;border:1px solid #b18b49;border-radius:24px;box-shadow:0 24px 55px #0007}
.hero-logo-panel img{max-width:68%;max-height:68%;object-fit:contain;filter:drop-shadow(0 12px 20px #0008)}
.btn{border-radius:12px}.btn-primary{background:linear-gradient(135deg,#f0d58f,#c49a4c)!important;color:#101a29!important;box-shadow:0 7px 0 #72572d!important}.btn-primary:hover{box-shadow:0 9px 0 #72572d!important}
.btn-outline{border-color:#c8a65e!important;color:#e8cb83!important}.btn-outline:hover{background:#d6ad59!important;color:#101a29!important}
.hero-strip{border-color:#263b57}.hero-strip .item{border-color:#263b57;color:#dbe2ec;background:#0d1b2d}.dot{background:#d6ad59}
section{padding:84px 0}.section-head h2{color:#f1d28b}.num{color:#d6ad59}
.value-grid{background:#263b57;border:1px solid #263b57;gap:1px;border-radius:18px;overflow:hidden}
.value-card{background:linear-gradient(145deg,#142640,#0e1b2e);padding:30px 24px;color:#e9edf4}.value-card h3{color:#f1d28b}.value-card p{color:#b5c2d4}.value-card .icon{color:#e0bd70}
.products{background:#081321!important;color:#e9edf4}.products .section-head p{color:#b5c2d4}.products .num{color:#e2c274}
.product-grid{gap:20px}.product-card{background:linear-gradient(150deg,#172b45,#0e1b2d);border:1px solid #2c4564;border-radius:18px;box-shadow:0 12px 30px #0003}
.product-card:hover{border-color:#d6ad59;transform:translateY(-5px)}.card-media{background:linear-gradient(145deg,#263c58,#14243a)!important;height:170px}
.card-media:after{background:linear-gradient(145deg,#ffffff12,transparent 55%,#0004)}.card-media svg{color:#e2c477}
.card-body{padding:24px 26px 28px}.product-card h3{color:#f1d28b}.product-card p,.product-card ul{color:#b9c6d8}
.product-card li,.card-link{border-color:#2b405d}.card-link{color:#e3c477}
.process-row{border-color:#2a405e}.process-row h3{color:#f1d28b}.process-row p{color:#b5c2d4}
.contact{background:#101e31!important;border-color:#2a405e}.contact-card,.contact-grid>div{color:#e9edf4}
input,select,textarea{background:#0b1728!important;color:#edf2f8!important;border:1px solid #344b69!important;border-radius:10px!important}
input::placeholder,textarea::placeholder{color:#8192aa}button:not(.btn):not(.cart-btn){border-radius:10px}
footer{background:#060e1a!important;color:#b8c5d7!important;border-top:1px solid #b18b49}footer a{color:#e2c477}
.cart-overlay{background:rgba(0,0,0,.7)}.cart-drawer{background:#101e31!important;color:#e9edf4!important;border-left:1px solid #b18b49}
.cart-drawer-head{border-bottom:1px solid #2b405d}.cart-drawer h2,.cart-total{color:#f1d28b}.cart-line{border-color:#2b405d}.cart-empty{color:#b5c2d4}
@media(max-width:700px){.hero{padding:38px 0 0}.hero-grid{gap:24px;padding-bottom:30px}.hero-logo-panel{aspect-ratio:16/9;order:-1;border-radius:20px}
.hero h1{font-size:clamp(30px,8vw,43px)}.hero p{font-size:15px}.hero-strip .item{flex:1 1 45%;padding:13px 12px;font-size:12px}
section{padding:58px 0}.value-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.value-card{padding:20px 14px}
.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card-media{height:112px}.card-body{padding:15px 13px 18px}.product-card h3{font-size:16px}.product-card p{font-size:12px}.product-card ul{font-size:11px}}


/* Page-wide component polish */
.login-screen{background:radial-gradient(ellipse at top,#203958,#081321)!important}
.login-box,.auth-gate,.spa-card,.acc-panel,.ord{background:linear-gradient(150deg,#172a43,#0e1b2d)!important;color:#edf2f8!important;border:1px solid #344b69!important;border-radius:18px!important;box-shadow:0 18px 48px #0006!important}
.login-box h2,.spa-card h2,.acc-wrap h1,.acc-panel h2,.ord-no{color:#f0d28b!important}
.login-box p,.acc-wrap .crumb,.acc-mail,.acc-panel .hint,.ord-date{color:#b5c2d4!important}
.sidebar{background:#071321!important;border-left:1px solid #344b69!important;color:#edf2f8!important}
.sidebar-brand{border-color:#263b57!important}.sidebar-brand strong{color:#f0d28b!important}
.sidebar-nav button{color:#c2cede!important}.sidebar-nav button.active{background:linear-gradient(135deg,#e7c77b,#b88c43)!important;color:#101a29!important}
.page-top{background:#101e31!important;border-color:#2b405d!important}.page-top h1{color:#f0d28b!important}
.page-top .search-box,.admin-card,.stat-card,.panel,.modal-content,.table-wrap{background:#142640!important;color:#e9edf4!important;border-color:#304866!important}
.acc-field input,.acc-field select{background:#0b1728!important;color:#edf2f8!important;border-color:#344b69!important}
.acc-save{background:linear-gradient(135deg,#f0d58f,#c49a4c)!important;color:#101a29!important;box-shadow:0 5px 0 #72572d!important}
.ord{border-radius:14px!important}.ord ul{border-color:#344b69!important}.ord li{border-color:#344b69!important;color:#e1e8f1}
.pill.new{background:#57371f;color:#ffd28a}.pill.done,.pill.paid{background:#173f35;color:#8ee0b4}.pill.other{background:#263a53;color:#c8d5e5}
button,.btn,a.button{transition:filter .18s,transform .18s}button:hover,.btn:hover{filter:brightness(1.08)}
@media(max-width:700px){.login-box{padding:28px 20px}.acc-wrap{padding:25px 14px 55px}.acc-wrap h1{font-size:25px}.acc-panel{padding:18px 15px}}

</style>
</head>
<body>

<!-- تسجيل الدخول -->
<div class="wrap" id="login-view">
  <div class="card login">
    <h1 style="margin-bottom:16px">دخول الموظفين</h1>
    <div class="field"><label>الإيميل</label><input id="l-email" type="email" autocomplete="username" dir="ltr"></div>
    <div class="field"><label>كلمة المرور</label><input id="l-pass" type="password" autocomplete="current-password" dir="ltr" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="err" id="l-err"></div>
    <button class="btn-dark" style="width:100%" onclick="doLogin()">دخول</button>
  </div>
</div>

<!-- إدارة المنتجات -->
<div class="wrap hidden" id="app-view">
  <div class="top">
    <h1>إدارة المنتجات</h1>
    <button class="btn-light" onclick="doLogout()">خروج</button>
  </div>
  <div class="banner hidden" id="fb-err"></div>

  <div class="card">
    <h2 id="form-title">إضافة منتج جديد</h2>
    <div class="grid">
      <div class="field"><label>اسم المنتج</label><input id="p-name" type="text"></div>
      <div class="field"><label>القسم</label><select id="p-cat"></select></div>
      <div class="field"><label>السعر للكرتونة (ج.م)</label><input id="p-price" type="number" min="0" step="0.01"></div>
      <div class="field"><label>الكمية بالمخزن</label><input id="p-qty" type="number" min="0"></div>
      <div class="field"><label>عدد القطع في الكرتونة (اختياري)</label><input id="p-pieces" type="number" min="1"></div>
      <div class="field"><label>المقاس/الحجم (اختياري)</label><input id="p-size" type="text"></div>
      <div class="field"><label>الباركود / SKU (اختياري)</label><input id="p-barcode" type="text"></div>
    </div>
    <div class="field"><label>الوصف (اختياري)</label><textarea id="p-desc"></textarea></div>
    <div class="field">
      <label>صورة المنتج</label>
      <input type="file" id="p-image" accept="image/*">
      <div class="preview" id="img-preview">صورة</div>
    </div>
    <button class="btn-dark" id="save-btn" onclick="saveProduct()">حفظ المنتج</button>
    <button class="btn-light hidden" id="cancel-btn" onclick="resetForm()">إلغاء التعديل</button>
  </div>

  <div class="card">
    <h2>المنتجات الحالية <span id="count" style="color:var(--muted);font-weight:400"></span></h2>
    <div class="field"><input id="search" type="text" placeholder="ابحث عن منتج..." oninput="renderTable()"></div>
    <div class="scroll">
      <table>
        <thead><tr><th>صورة</th><th>الاسم</th><th>السعر</th><th>المخزون</th><th>القسم</th><th>الحالة</th><th></th></tr></thead>
        <tbody id="tbody"><tr><td colspan="7">جاري التحميل...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>if (top !== self) { top.location = self.location; }</script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="assets/firebase-init.js"></script>
<script src="assets/shop.js"></script>
<script src="assets/admin.js"></script>
<script>
  /* الصفحة دي للموظفين: إضافة وتعديل المنتجات فقط — من غير أسعار الجملة/الشحن ومن غير أي بيانات تانية */
  let allProducts = [];
  let pendingImage = "";
  let editing = null;
  let started = false;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove("show"), 2200);
  }
  function showErr(err) {
    console.error(err);
    const b = $("fb-err"); b.classList.remove("hidden");
    b.textContent = "تعذر تنفيذ العملية (" + (err && err.code ? err.code : "خطأ") + ") — لو الحساب مش مسموح له بالكتابة كلّم المدير.";
  }

  /* ---------- تسجيل الدخول ---------- */
  function doLogin() {
    const email = $("l-email").value.trim(), pass = $("l-pass").value;
    $("l-err").textContent = "";
    if (!email || !pass) { $("l-err").textContent = "اكتب الإيميل وكلمة المرور"; return; }
    firebase.auth().signInWithEmailAndPassword(email, pass)
      .catch(() => { $("l-err").textContent = "الإيميل أو كلمة المرور غير صحيحة"; });
  }
  function doLogout() { firebase.auth().signOut(); }

  firebase.auth().onAuthStateChanged(async user => {
    if (!user) {
      $("login-view").classList.remove("hidden");
      $("app-view").classList.add("hidden");
      return;
    }
    // الدخول مسموح للأدمن أو لأي حساب مضاف في قايمة الموظفين (من لوحة الأدمن ← الإعدادات)
    let ok = user.email === ADMIN_EMAIL;
    if (!ok) {
      try { ok = (await db.ref("staff/" + user.uid).once("value")).exists(); } catch (e) { ok = false; }
      // حساب المندوب ممنوع من صفحة الموظفين حتى لو اتسجّل بالغلط كموظف
      if (ok) { try { if ((await db.ref("couriers/" + user.uid).once("value")).exists()) ok = false; } catch (e) {} }
    }
    if (!ok) {
      $("l-err").textContent = "الحساب ده غير مصرح له بالدخول. كلّم المدير.";
      $("login-view").classList.remove("hidden");
      $("app-view").classList.add("hidden");
      firebase.auth().signOut();
      return;
    }
    $("login-view").classList.add("hidden");
    $("app-view").classList.remove("hidden");
    if (!started) { started = true; startApp(); }
  });

  /* ---------- تشغيل الصفحة ---------- */
  function startApp() {
    initCategories(() => {
      const cur = $("p-cat").value;
      $("p-cat").innerHTML = CATEGORIES.map(c => `<option value="${esc(c.slug)}">${esc(c.name)}</option>`).join("");
      if (cur) $("p-cat").value = cur;
      renderTable();
    });
    loadProducts(null, list => { allProducts = list; renderTable(); });
  }

  $("p-image").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    $("img-preview").textContent = "جاري التجهيز...";
    try { pendingImage = await compressImage(f); $("img-preview").innerHTML = `<img src="${pendingImage}">`; }
    catch { $("img-preview").textContent = "تعذر تحميل الصورة"; }
  });

  /* ---------- جدول المنتجات ---------- */
  function renderTable() {
    const q = ($("search").value || "").trim().toLowerCase();
    const list = allProducts.filter(p => !q || (p.name||"").toLowerCase().includes(q) || (p.barcode||"").toLowerCase().includes(q));
    $("count").textContent = `(${list.length})`;
    if (!list.length) { $("tbody").innerHTML = `<tr><td colspan="7">لا يوجد منتجات</td></tr>`; return; }
    $("tbody").innerHTML = list.map(p => `
      <tr>
        <td><div class="thumb">${p.image ? `<img src="${p.image}">` : ""}</div></td>
        <td>${esc(p.name)}</td>
        <td>${Number(p.price || 0).toFixed(2)}</td>
        <td>${p.qty ?? 0}</td>
        <td>${esc(catName(p.category))}</td>
        <td><span class="pill ${(p.qty ?? 0) > 0 ? "ok" : "low"}">${(p.qty ?? 0) > 0 ? "متوفر" : "غير متوفر"}</span></td>
        <td><button class="btn-light" style="padding:6px 12px" onclick="editProduct('${esc(p.category)}','${esc(p.id)}')">تعديل</button></td>
      </tr>`).join("");
  }

  /* ---------- إضافة / تعديل ---------- */
  function resetForm() {
    ["p-name","p-price","p-qty","p-pieces","p-size","p-barcode","p-desc"].forEach(i => $(i).value = "");
    $("p-image").value = ""; $("img-preview").textContent = "صورة";
    $("p-cat").disabled = false;
    pendingImage = ""; editing = null;
    $("form-title").textContent = "إضافة منتج جديد";
    $("save-btn").textContent = "حفظ المنتج";
    $("cancel-btn").classList.add("hidden");
  }

  function editProduct(category, id) {
    const p = allProducts.find(x => x.id === id && x.category === category);
    if (!p) return;
    editing = { category, id };
    $("p-name").value = p.name || "";
    $("p-cat").value = p.category; $("p-cat").disabled = true; // نقل المنتج بين الأقسام من المدير بس
    $("p-price").value = p.price ?? "";
    $("p-qty").value = p.qty ?? 0;
    $("p-pieces").value = p.piecesPerCarton || "";
    $("p-size").value = p.size || "";
    $("p-barcode").value = p.barcode || "";
    $("p-desc").value = p.description || "";
    $("img-preview").innerHTML = p.image ? `<img src="${p.image}">` : "صورة";
    pendingImage = "";
    $("form-title").textContent = "تعديل منتج";
    $("save-btn").textContent = "حفظ التعديل";
    $("cancel-btn").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function saveProduct() {
    const name = $("p-name").value.trim();
    const category = $("p-cat").value;
    const price = parseFloat($("p-price").value || "0");
    const qty = parseInt($("p-qty").value || "0");
    const piecesPerCarton = parseInt($("p-pieces").value || "0") || null;
    const size = $("p-size").value.trim();
    const barcode = $("p-barcode").value.trim();
    const description = $("p-desc").value.trim();
    if (!name || !price) { toast("اكتب اسم المنتج والسعر على الأقل"); return; }

    $("save-btn").disabled = true;
    let op;
    if (editing) {
      const upd = { name, qty, price, barcode, description, piecesPerCarton, size };
      if (pendingImage) upd.image = pendingImage;
      op = updateProduct(editing.category, editing.id, upd);
    } else {
      op = addProduct({ name, category, qty, price, barcode, description, piecesPerCarton, size, image: pendingImage });
    }
    op.then(() => { toast(editing ? "تم تعديل المنتج" : "تم إضافة المنتج"); resetForm(); $("fb-err").classList.add("hidden"); })
      .catch(showErr)
      .finally(() => { $("save-btn").disabled = false; });
  }
</script>
</body>
</html>
