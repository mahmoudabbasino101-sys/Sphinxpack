<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>شكرًا لطلبك — SphinxPack</title>
<link rel="icon" href="assets/images/sphinx-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFECE4; --ink:#211D18; --kraft:#A9784E; --signal:#E1531B; --line:#D4CDBD;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--ink); font-family:'Cairo','Tajawal',sans-serif;
    padding:20px;
  }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    max-width:420px; width:100%; padding:36px 28px; text-align:center;
  }
  .logo{width:64px; height:64px; border-radius:50%; overflow:hidden; margin:0 auto 18px; background:var(--ink); display:flex; align-items:center; justify-content:center}
  .logo img{width:100%; height:100%; object-fit:contain; padding:8px}
  .icon{font-size:44px; margin-bottom:8px}
  h1{font-family:'Tajawal',sans-serif; font-size:22px; margin:0 0 10px}
  p{color:#5b5548; font-size:15px; line-height:1.8; margin:0 0 22px}
  .order-num{display:inline-block; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:6px 16px; font-weight:800; margin-bottom:22px}
  .btn{
    display:inline-block; width:100%; padding:13px; border-radius:10px; text-decoration:none;
    font-weight:700; font-size:15px; background:var(--signal); color:#fff;
  }
  .btn.secondary{background:transparent; border:1px solid var(--line); color:var(--ink); margin-top:10px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="assets/images/sphinx-logo.png" alt="SphinxPack"></div>
    <div class="icon" id="status-icon">🙏</div>
    <h1 id="status-title">شكرًا لطلبك من SphinxPack</h1>
    <p id="status-message">هنراجع طلبك ونأكد الدفع خلال وقت قصير، وهنتواصل معاك على واتساب.</p>
    <div class="order-num" id="order-num" style="display:none"></div>
    <div id="tech" style="display:none;font-size:11px;color:#9a9486;margin-bottom:10px;word-break:break-all"></div>
    <a href="#" id="wa-pay" class="btn" style="display:none;background:#25D366;margin-bottom:10px" target="_blank">📲 ابعت تأكيد الدفع على واتساب</a>
    <a href="index.html" class="btn">العودة للمتجر</a>
    <a href="https://wa.me/201028735709" id="wa-link" class="btn secondary">تواصل معنا على واتساب</a>
  </div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="assets/firebase-init.js"></script>
<script src="assets/shop.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const success = params.get("success");
  const merchantOrderId = params.get("merchant_order_id") || params.get("order") || "";
  const directOrderId = params.get("order_id") || ""; // لما نيجي من صفحة السلة مباشرة (كاش/محفظة)

  if (success === "true") {
    document.getElementById("status-icon").textContent = "🎉";
    document.getElementById("status-title").textContent = "تم الدفع بنجاح";
    document.getElementById("status-message").textContent = "شكرًا لثقتك في SphinxPack! هنبدأ في تجهيز طلبك على طول.";
  }

  function showOrderNumber(num) {
    if (!num) return;
    const el = document.getElementById("order-num");
    el.textContent = "رقم الأوردر #" + num;
    el.style.display = "inline-block";
  }

  /* معرّف Firebase نفسه بيبدأ بـ "-" فمينفعش نقسم على أول "-": بنشيل بس آخر جزء (الوقت) */
  let firebaseOrderId = directOrderId || (merchantOrderId ? merchantOrderId.replace(/-\d{10,}$/, "") : "");
  if (!firebaseOrderId) { try { firebaseOrderId = localStorage.getItem("sp_pending_id") || ""; } catch (e) {} }

  /* رسالة واتساب بنفس شكل رسالة الدفع عند الاستلام (بتتبني من بيانات الأوردر اللي رجعت من السيرفر بعد توقيع Paymob) */
  function payWhatsAppLink(o) {
    const paid = o.paymentMethod === "deposit" ? (o.depositAmount || 0) : (o.total || 0);
    const rest = Math.max(0, (o.total || 0) - paid);
    const items = (o.items || []).map((l, i) =>
      `${i + 1}) ${l.name} — الكمية: ${l.qty} × ${l.price} ج.م = ${(l.qty * l.price).toFixed(2)} ج.م`).join("\n");
    const msg = `*طلب جديد من موقع SphinxPack*\n` +
      `✅ *تم الدفع ${o.paymentMethod === "deposit" ? "(عربون)" : "بالكامل"} عن طريق Paymob*\n\n` +
      `رقم الأوردر: #${o.orderNumber || ""}\n` +
      `الاسم: ${o.customerName || ""}\n` +
      `رقم التواصل: ${o.customerPhone || ""}\n` +
      (o.address ? `العنوان: ${o.address}\n` : "") +
      (o.notes ? `ملاحظات: ${o.notes}\n` : "") +
      `\nتفاصيل الطلب:\n${items}\n\n` +
      `*الإجمالي: ${Number(o.total || 0).toFixed(2)} ج.م*\n` +
      `*المبلغ المدفوع: ${Number(paid).toFixed(2)} ج.م*` +
      (rest > 0 ? `\n*المتبقي عند الاستلام: ${rest.toFixed(2)} ج.م*` : "");
    return "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg);
  }

  /* الصفحة بتقرا نسخة عامة من الأوردر (رقمه وحالة الدفع بس — من غير أي بيانات شخصية)،
     وبيانات العميل الكاملة بتيجي من السيرفر بس لو الرجوع جاي بتوقيع Paymob صحيح. */
  let pub = null, full = null, tries = success === "true" ? 10 : 0, fallbackDone = false;

  function render() {
    if (pub) showOrderNumber(pub.orderNumber);
    if (!pub || pub.paymentStatus !== "paid" || fallbackDone) return;
    if (pub.notify === "sent") return;                 // وصلتك رسالة الواتساب تلقائي من السيرفر
    if (pub.notify === "pending" && tries > 0) return;  // لسه بنستنى نتيجة الإشعار التلقائي
    if (!full) return;                                  // مفيش بيانات كاملة (الصفحة اتفتحت من غير رجوع Paymob)
    fallbackDone = true;
    const a = document.getElementById("wa-pay");
    a.href = payWhatsAppLink(full); a.style.display = "inline-block";
    let done = false; try { done = localStorage.getItem("sp_wa_" + firebaseOrderId) === "1"; } catch (e) {}
    if (!done) {
      try { localStorage.setItem("sp_wa_" + firebaseOrderId, "1"); } catch (e) {}
      document.getElementById("status-message").textContent = "جاري فتح واتساب لإرسال تأكيد الدفع...";
      setTimeout(() => { location.href = a.href; }, 1800);
    }
  }

  function loadPublic() {
    if (!firebaseOrderId || typeof db === "undefined") return;
    db.ref("orders_public/" + firebaseOrderId).once("value").then(snap => {
      pub = snap.val();
      if (!pub) { if (tries > 0) { tries--; setTimeout(loadPublic, 2000); } return; }
      if (pub.paymentStatus === "paid" && pub.notify === "pending" && tries > 0) { tries--; setTimeout(loadPublic, 1500); }
      render();
    }).catch(() => {});
  }
  loadPublic();

  /* تأكيد الدفع فوراً من السيرفر (بيتحقق من توقيع Paymob وبينشئ الأوردر لو الـ Webhook لسه ماوصلش).
     لو الإشعار لسه شغال على نفس الأوردر بنعيد المحاولة كذا مرة. */
  function confirmPayment(attempt) {
    const all = {}; params.forEach((v, k) => { all[k] = v; });
    let pid = ""; try { pid = localStorage.getItem("sp_pending_id") || ""; } catch (e) {}
    fetch(PAYMENT_SERVER_URL + "/api/confirm-payment", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ params: all, pid })
    }).then(r => r.json()).then(d => {
      if (d && d.ok) {
        full = d.order || null;
        if (!firebaseOrderId && d.orderId) firebaseOrderId = d.orderId;
        showOrderNumber(d.orderNumber);
        try { localStorage.removeItem("sp_pending_id"); } catch (e) {}
        loadPublic(); render();
        return;
      }
      if (d && (d.status === "no-pending" || d.status === "busy") && attempt < 4) { setTimeout(() => confirmPayment(attempt + 1), 2000); return; }
      if (d && (d.status === "needs-review" || d.status === "amount-mismatch")) document.getElementById("status-message").textContent = "تم استلام دفعتك وجاري مراجعة الطلب، هنتواصل معاك قريباً.";
      const t = document.getElementById("tech"); t.style.display = "block";
      t.textContent = "تفاصيل فنية: " + (d && (d.reason || d.status || d.error) || "unknown") + (d && d.debug ? " | mid=" + d.debug.mid + " | pid=" + d.debug.pid + " | id=" + d.debug.resolved : "");
    }).catch(() => {});
  }
  if (success === "true" && typeof PAYMENT_SERVER_URL !== "undefined") confirmPayment(0);

  initSettings(() => {
    document.getElementById("wa-link").href = "https://wa.me/" + WHATSAPP_NUMBER;
  });
</script>
</body>
</html>
