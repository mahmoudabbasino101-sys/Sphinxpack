<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SphinxPack — الأقسام</title>
<meta name="description" id="meta-description" content="تصفح كل أقسام سفينكس باك لمستلزمات التغليف والضيافة بالجملة — أكواب، علب وجبات، أدوات فويل، وأدوات مائدة بأسعار جملة مناسبة للمطاعم والكافيهات.">
<meta name="keywords" content="مستلزمات تغليف بالجملة, أكواب بلاستيك, علب وجبات, أدوات فويل, مستلزمات مطاعم, سفينكس باك">
<link rel="icon" href="assets/images/sphinx-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<div class="page-head">
  <div class="wrap">
    <div class="crumbs"><a href="index.html">الرئيسية</a> / <span id="crumb-cat">القسم</span></div>
    <h1 id="cat-title">القسم</h1>
    <p id="cat-desc"></p>
  </div>
</div>

<main class="wrap">
  <div class="prod-grid" id="prod-grid"></div>
  <p class="empty-note hidden" id="empty-note">لا توجد منتجات في هذا القسم حاليًا — تابعنا قريبًا.</p>
</main>

<footer id="site-footer"></footer>

<div id="product-modal" style="display:none;position:fixed;inset:0;background:rgba(33,29,24,.55);z-index:200;align-items:center;justify-content:center;padding:16px">
  <div style="background:#fff;border-radius:14px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;padding:20px;position:relative">
    <button onclick="closeProductModal()" style="position:absolute;top:12px;left:12px;background:#f3f1ec;border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer">×</button>
    <div id="pm-image" style="width:100%;height:200px;border-radius:10px;overflow:hidden;background:#f3f1ec;display:flex;align-items:center;justify-content:center;margin-bottom:16px"></div>
    <h3 id="pm-name" style="margin:0 0 8px;font-size:19px"></h3>
    <p id="pm-desc" style="color:#5b5548;font-size:14px;line-height:1.7;margin:0 0 12px"></p>
    <div id="pm-pieces" style="font-size:13.5px;color:#5b5548;margin-bottom:6px"></div>
    <div id="pm-price" style="font-weight:800;font-size:18px;margin-bottom:16px"></div>
    <div class="add-row" style="display:flex;gap:10px;align-items:center">
      <div class="qty-box">
        <button onclick="pmStepQty(-1)">−</button>
        <input id="pm-qty" value="1" readonly>
        <button onclick="pmStepQty(1)">+</button>
      </div>
      <button class="btn btn-amber" id="pm-add-btn" style="flex:1">أضف للسلة</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="assets/firebase-init.js"></script>
<script src="assets/shop.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const grid = document.getElementById("prod-grid");
  const emptyNote = document.getElementById("empty-note");
  const productsById = {};

  window.stepQty = function (id, delta) {
    const input = document.getElementById("q-" + id);
    const v = Math.max(1, parseInt(input.value || "1") + delta);
    input.value = v;
  };
  window.addFromCard = function (p, btn) {
    const qty = parseInt(document.getElementById("q-" + p.id).value || "1");
    addToCart(p, qty);
    if (btn) flashAddedState(btn);
  };
  window.flashAddedState = function (btn) {
    if (btn._flashTimer) clearTimeout(btn._flashTimer);
    if (!btn.dataset.originalText) btn.dataset.originalText = btn.textContent;
    btn.textContent = "✓ تمت الإضافة";
    btn.style.background = "var(--amber)";
    btn._flashTimer = setTimeout(() => {
      btn.textContent = btn.dataset.originalText;
      btn.style.background = "";
    }, 1200);
  };

  let currentModalProduct = null;
  window.openProductModal = function (id) {
    const p = productsById[id];
    if (!p) return;
    currentModalProduct = p;
    document.getElementById("pm-image").innerHTML = p.image
      ? `<img src="${p.image}" style="width:100%;height:100%;object-fit:cover">`
      : (ICONS[p._iconSlug] || ICONS.box);
    document.getElementById("pm-name").textContent = p.name + (p.size ? ` (${p.size})` : "");
    document.getElementById("pm-desc").textContent = p.description || "";
    document.getElementById("pm-pieces").textContent = p.piecesPerCarton ? `عدد القطع في الكرتونة: ${p.piecesPerCarton} قطعة` : "";
    document.getElementById("pm-price").textContent = `${(p.price || 0).toFixed(2)} ج.م / الكرتونة`;
    document.getElementById("pm-qty").value = 1;
    document.getElementById("pm-add-btn").onclick = (e) => {
      const qty = parseInt(document.getElementById("pm-qty").value || "1");
      addToCart(p, qty);
      flashAddedState(e.currentTarget);
      setTimeout(closeProductModal, 600);
    };
    document.getElementById("product-modal").style.display = "flex";
  };
  window.closeProductModal = function () {
    document.getElementById("product-modal").style.display = "none";
  };
  window.pmStepQty = function (delta) {
    const input = document.getElementById("pm-qty");
    input.value = Math.max(1, parseInt(input.value || "1") + delta);
  };

  initSettings(() => initCategories(function () {
    const searchQuery = params.get("search");

    function iconFor(catSlug) {
      const c = CATEGORIES.find(x => x.slug === catSlug);
      return (c && ICONS[c.icon]) || ICONS.box;
    }

    function card(p, iconOverride, iconSlug) {
      const stockOk = (p.qty ?? 0) > 0;
      productsById[p.id] = { ...p, _iconSlug: iconSlug };
      return `
      <div class="prod-card">
        <div class="thumb" style="cursor:pointer" onclick="openProductModal('${p.id}')">${p.image ? `<img src="${p.image}" alt="${p.name}">` : (iconOverride || iconFor(p.category))}</div>
        <div class="body">
          <h4 style="cursor:pointer" onclick="openProductModal('${p.id}')">${p.name}</h4>
          ${p.size ? `<div class="size-tag">${p.size}</div>` : ""}
          <span class="stock ${stockOk ? "" : "low"}">${stockOk ? "متوفر" : "غير متوفر حاليًا"}</span>
          <div class="add-row">
            <div class="qty-box">
              <button onclick="stepQty('${p.id}',-1)">−</button>
              <input id="q-${p.id}" value="1" readonly>
              <button onclick="stepQty('${p.id}',1)">+</button>
            </div>
            <button class="btn btn-amber" ${stockOk ? "" : "disabled"} onclick='addFromCard(${safeJson(p)}, this)'>أضف للسلة</button>
          </div>
        </div>
      </div>`;
    }

    if (searchQuery) {
      mountHeader(null);
      mountFooter();
      document.title = `نتائج البحث عن "${searchQuery}" — SphinxPack`;
      document.getElementById("meta-description").setAttribute("content", `نتائج البحث عن ${searchQuery} في متجر سفينكس باك.`);
      document.getElementById("crumb-cat").textContent = "نتائج البحث";
      document.getElementById("cat-title").textContent = `نتائج البحث عن "${searchQuery}"`;
      document.getElementById("cat-desc").textContent = "كل المنتجات المطابقة لبحثك.";

      loadProducts(null, list => {
        const q = searchQuery.trim().toLowerCase();
        const filtered = list.filter(p => (p.name || "").toLowerCase().includes(q));
        if (!filtered.length) {
          grid.innerHTML = "";
          emptyNote.classList.remove("hidden");
          document.getElementById("empty-note").textContent = `مفيش منتجات مطابقة لـ "${searchQuery}"`;
          return;
        }
        emptyNote.classList.add("hidden");
        grid.innerHTML = filtered.map(p => card(p)).join("");
      });
      return;
    }

    const slug = params.get("cat") || CATEGORIES[0].slug;
    const cat = CATEGORIES.find(c => c.slug === slug) || CATEGORIES[0];

    mountHeader(cat.slug);
    mountFooter();

    document.title = `${cat.name} — SphinxPack`;
    document.getElementById("meta-description").setAttribute("content",
      `تصفح كل منتجات ${cat.name} بالجملة من سفينكس باك — أسعار جملة مناسبة للمطاعم والكافيهات وشركات الكاترينج، والطلب عبر واتساب.`);
    document.getElementById("crumb-cat").textContent = cat.name;
    document.getElementById("cat-title").textContent = cat.name;
    document.getElementById("cat-desc").textContent = cat.description || ("تصفح كل منتجات " + cat.name + " بالجملة.");

    loadProducts(cat.slug, list => {
      if (!list.length) {
        grid.innerHTML = "";
        emptyNote.classList.remove("hidden");
        return;
      }
      emptyNote.classList.add("hidden");
      grid.innerHTML = list.map(p => card(p, ICONS[cat.icon] || ICONS.box, cat.icon)).join("");
    });
  }));
</script>
</body>
</html>
