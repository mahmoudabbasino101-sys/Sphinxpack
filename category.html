<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SphinxPack — الأقسام</title>
<meta name="description" id="meta-description" content="تصفح كل أقسام سفينكس باك لمستلزمات التغليف والضيافة بالجملة — أكواب، علب وجبات، أدوات فويل، وأدوات مائدة بأسعار جملة مناسبة للمطاعم والكافيهات.">
<meta name="keywords" content="مستلزمات تغليف بالجملة, أكواب بلاستيك, علب وجبات, أدوات فويل, مستلزمات مطاعم, سفينكس باك">
<link rel="icon" href="assets/images/sphinx-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/customer-auth.css">

<style id="sphinxpack-navy-gold-v6">

/* SphinxPack Navy & Gold visual refresh v5 — CSS only */
:root{--paper:#0b1423;--paper-2:#101d30;--ink:#e9edf4;--ink-2:#13233a;--kraft:#d8b56b;--kraft-dark:#e5c77f;--signal:#d6ad59;--signal-dark:#b88c3e;--line:#263b57;--text:#e9edf4;--text-soft:#aebbd0;--white:#14243a;--danger:#ff7777;--success:#70d6a1;--radius-s:12px;--radius-m:18px;--shadow:0 18px 48px rgba(0,0,0,.35);--wa:#25D366}
html{scroll-behavior:smooth} body{background:var(--paper)!important;color:var(--text)!important} h1,h2,h3,h4{color:#f4f6fa} a{color:inherit}
.wrap{max-width:1200px}
.topbar{background:#060d18;color:#d8b56b;border-bottom:1px solid #243650}.topbar a{color:#d8b56b}
header.site-header,header{background:rgba(7,16,29,.96)!important;color:#f4f6fa;border-bottom:1px solid #b99550!important;backdrop-filter:blur(14px)}
.nav-row,.nav{padding-top:14px;padding-bottom:14px}
.logo .mark,.logo-mark{background:linear-gradient(145deg,#f0d58f,#a77d35)!important;color:#111b2b!important;border-radius:14px}
.logo .brand,.logo-text strong{color:#f1d28b!important}.logo .brand small,.logo-text em{color:#b9c6d8!important}
nav.cat-nav{background:#0e1b2e;border-top:1px solid #20334e}nav.cat-nav a{color:#c5cfdd}nav.cat-nav a:hover,nav.cat-nav a.active{color:#f0d28a;border-bottom-color:#d6ad59}
.cart-btn{background:linear-gradient(135deg,#e4c477,#b98e43)!important;color:#101a29!important;border-radius:12px;box-shadow:0 7px 18px #0005}.cart-btn .count{background:#101a29;color:#f3d58d}
.hero{background:radial-gradient(ellipse at 15% 30%,#1b3554 0%,#0b1423 58%,#08111e 100%)!important;color:#f5f6f8;border-bottom:1px solid #263b57}
.hero h1{color:#f6f7fa}.hero h1 em{color:#e5c477}.hero p,.section-head p{color:#b5c2d4}
.eyebrow{color:#e3c477}.eyebrow:before{background:#d6ad59}
.hero-logo-panel{background:linear-gradient(145deg,#1b2e49,#0b1423)!important;border:1px solid #b18b49;border-radius:24px;box-shadow:0 24px 55px #0007}
.hero-logo-panel img{max-width:68%;max-height:68%;object-fit:contain;filter:drop-shadow(0 12px 20px #0008)}
.btn{border-radius:12px}.btn-primary{background:linear-gradient(135deg,#f0d58f,#c49a4c)!important;color:#101a29!important;box-shadow:0 7px 0 #72572d!important}.btn-primary:hover{box-shadow:0 9px 0 #72572d!important}
.btn-outline{border-color:#c8a65e!important;color:#e8cb83!important}.btn-outline:hover{background:#d6ad59!important;color:#101a29!important}
.hero-strip{border-color:#263b57}.hero-strip .item{border-color:#263b57;color:#dbe2ec;background:#0d1b2d}.dot{background:#d6ad59}
section{padding:84px 0}.section-head h2{color:#f1d28b}.num{color:#d6ad59}
.value-grid{background:#263b57;border:1px solid #263b57;gap:1px;border-radius:18px;overflow:hidden}
.value-card{background:linear-gradient(145deg,#142640,#0e1b2e);padding:30px 24px;color:#e9edf4}.value-card h3{color:#f1d28b}.value-card p{color:#b5c2d4}.value-card .icon{color:#e0bd70}
.products{background:#081321!important;color:#e9edf4}.products .section-head p{color:#b5c2d4}.products .num{color:#e2c274}
.product-grid{gap:20px}.product-card{background:linear-gradient(150deg,#172b45,#0e1b2d);border:1px solid #2c4564;border-radius:18px;box-shadow:0 12px 30px #0003}
.product-card:hover{border-color:#d6ad59;transform:translateY(-5px)}.card-media{background:linear-gradient(145deg,#263c58,#14243a)!important;height:170px}
.card-media:after{background:linear-gradient(145deg,#ffffff12,transparent 55%,#0004)}.card-media svg{color:#e2c477}
.card-body{padding:24px 26px 28px}.product-card h3{color:#f1d28b}.product-card p,.product-card ul{color:#b9c6d8}
.product-card li,.card-link{border-color:#2b405d}.card-link{color:#e3c477}
.process-row{border-color:#2a405e}.process-row h3{color:#f1d28b}.process-row p{color:#b5c2d4}
.contact{background:#101e31!important;border-color:#2a405e}.contact-card,.contact-grid>div{color:#e9edf4}
input,select,textarea{background:#0b1728!important;color:#edf2f8!important;border:1px solid #344b69!important;border-radius:10px!important}
input::placeholder,textarea::placeholder{color:#8192aa}button:not(.btn):not(.cart-btn){border-radius:10px}
footer{background:#060e1a!important;color:#b8c5d7!important;border-top:1px solid #b18b49}footer a{color:#e2c477}
.cart-overlay{background:rgba(0,0,0,.7)}.cart-drawer{background:#101e31!important;color:#e9edf4!important;border-left:1px solid #b18b49}
.cart-drawer-head{border-bottom:1px solid #2b405d}.cart-drawer h2,.cart-total{color:#f1d28b}.cart-line{border-color:#2b405d}.cart-empty{color:#b5c2d4}
@media(max-width:700px){.hero{padding:38px 0 0}.hero-grid{gap:24px;padding-bottom:30px}.hero-logo-panel{aspect-ratio:16/9;order:-1;border-radius:20px}
.hero h1{font-size:clamp(30px,8vw,43px)}.hero p{font-size:15px}.hero-strip .item{flex:1 1 45%;padding:13px 12px;font-size:12px}
section{padding:58px 0}.value-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.value-card{padding:20px 14px}
.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card-media{height:112px}.card-body{padding:15px 13px 18px}.product-card h3{font-size:16px}.product-card p{font-size:12px}.product-card ul{font-size:11px}}


/* Page-wide component polish */
.login-screen{background:radial-gradient(ellipse at top,#203958,#081321)!important}
.login-box,.auth-gate,.spa-card,.acc-panel,.ord{background:linear-gradient(150deg,#172a43,#0e1b2d)!important;color:#edf2f8!important;border:1px solid #344b69!important;border-radius:18px!important;box-shadow:0 18px 48px #0006!important}
.login-box h2,.spa-card h2,.acc-wrap h1,.acc-panel h2,.ord-no{color:#f0d28b!important}
.login-box p,.acc-wrap .crumb,.acc-mail,.acc-panel .hint,.ord-date{color:#b5c2d4!important}
.sidebar{background:#071321!important;border-left:1px solid #344b69!important;color:#edf2f8!important}
.sidebar-brand{border-color:#263b57!important}.sidebar-brand strong{color:#f0d28b!important}
.sidebar-nav button{color:#c2cede!important}.sidebar-nav button.active{background:linear-gradient(135deg,#e7c77b,#b88c43)!important;color:#101a29!important}
.page-top{background:#101e31!important;border-color:#2b405d!important}.page-top h1{color:#f0d28b!important}
.page-top .search-box,.admin-card,.stat-card,.panel,.modal-content,.table-wrap{background:#142640!important;color:#e9edf4!important;border-color:#304866!important}
.acc-field input,.acc-field select{background:#0b1728!important;color:#edf2f8!important;border-color:#344b69!important}
.acc-save{background:linear-gradient(135deg,#f0d58f,#c49a4c)!important;color:#101a29!important;box-shadow:0 5px 0 #72572d!important}
.ord{border-radius:14px!important}.ord ul{border-color:#344b69!important}.ord li{border-color:#344b69!important;color:#e1e8f1}
.pill.new{background:#57371f;color:#ffd28a}.pill.done,.pill.paid{background:#173f35;color:#8ee0b4}.pill.other{background:#263a53;color:#c8d5e5}
button,.btn,a.button{transition:filter .18s,transform .18s}button:hover,.btn:hover{filter:brightness(1.08)}
@media(max-width:700px){.login-box{padding:28px 20px}.acc-wrap{padding:25px 14px 55px}.acc-wrap h1{font-size:25px}.acc-panel{padding:18px 15px}}

</style>
</head>
<body>

<header class="site-header" id="site-header"></header>

<div class="page-head">
  <div class="wrap">
    <div class="crumbs"><a href="index.html">الرئيسية</a> / <span id="crumb-cat">القسم</span></div>
    <h1 id="cat-title">القسم</h1>
    <p id="cat-desc"></p>
  </div>
</div>

<main class="wrap">
  <div class="prod-grid" id="prod-grid" aria-busy="true"><div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-btn"></div></div><div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-btn"></div></div><div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-btn"></div></div><div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-btn"></div></div><div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-btn"></div></div><div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-btn"></div></div><div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-btn"></div></div><div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-btn"></div></div></div>
  <p class="empty-note hidden" id="empty-note">لا توجد منتجات في هذا القسم حاليًا — تابعنا قريبًا.</p>
</main>

<footer id="site-footer"></footer>

<div id="product-modal" style="display:none;position:fixed;inset:0;background:rgba(33,29,24,.55);z-index:200;align-items:center;justify-content:center;padding:16px">
  <div style="background:#fff;border-radius:14px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;padding:20px;position:relative">
    <button onclick="closeProductModal()" style="position:absolute;top:12px;left:12px;background:#f3f1ec;border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer">×</button>
    <div id="pm-image" style="width:100%;height:200px;border-radius:10px;overflow:hidden;background:#f3f1ec;display:flex;align-items:center;justify-content:center;margin-bottom:16px"></div>
    <h3 id="pm-name" style="margin:0 0 8px;font-size:19px"></h3>
    <p id="pm-desc" style="color:#5b5548;font-size:14px;line-height:1.7;margin:0 0 12px"></p>
    <div id="pm-pieces" style="font-size:13.5px;color:#5b5548;margin-bottom:6px"></div>
    <div id="pm-price" style="font-weight:800;font-size:18px;margin-bottom:16px"></div>
    <div class="add-row" style="display:flex;gap:10px;align-items:center">
      <div class="qty-box">
        <button onclick="pmStepQty(-1)">−</button>
        <input id="pm-qty" value="1" readonly>
        <button onclick="pmStepQty(1)">+</button>
      </div>
      <button class="btn btn-amber" id="pm-add-btn" style="flex:1">أضف للسلة</button>
    </div>
    <div id="pm-msg" style="display:none;color:#e0455a;font-size:13px;margin-top:8px;font-weight:700"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="assets/firebase-init.js"></script>
<script src="assets/shop.js"></script>
<script src="assets/customer-auth.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const grid = document.getElementById("prod-grid");
  const emptyNote = document.getElementById("empty-note");
  const productsById = {};

  /* بنمنع زيادة الكمية عن المتاح في المخزن ونقول للعميل المتاح كام */
  function showStockMsg(el, stock) {
    if (!el) return;
    el.textContent = stockMsg(stock);
    el.style.display = "block";
  }
  window.stepQty = function (id, delta) {
    const input = document.getElementById("q-" + id);
    const p = productsById[id];
    const msg = document.getElementById("m-" + id);
    let v = Math.max(1, parseInt(input.value || "1") + delta);
    const stock = p && typeof p.qty === "number" ? p.qty : null;
    if (stock !== null && v > stock) { v = Math.max(1, stock); showStockMsg(msg, stock); }
    else if (msg) msg.style.display = "none";
    input.value = v;
  };
  window.addFromCard = function (p, btn) {
    const qty = parseInt(document.getElementById("q-" + p.id).value || "1");
    if (addToCart(p, qty)) { if (btn) { flashAddedState(btn); flyToCart(btn); } }
    else if (typeof p.qty === "number") showStockMsg(document.getElementById("m-" + p.id), p.qty);
  };
  window.flashAddedState = function (btn) {
    if (btn._flashTimer) clearTimeout(btn._flashTimer);
    if (!btn.dataset.originalText) btn.dataset.originalText = btn.textContent;
    btn.textContent = "✓ تمت الإضافة";
    btn.style.background = "var(--amber)";
    btn._flashTimer = setTimeout(() => {
      btn.textContent = btn.dataset.originalText;
      btn.style.background = "";
    }, 1200);
  };

  let currentModalProduct = null;
  window.openProductModal = function (id) {
    const p = productsById[id];
    if (!p) return;
    currentModalProduct = p;
    document.getElementById("pm-image").innerHTML = p.image
      ? `<img src="${escHtml(safeImg(p.image))}" style="width:100%;height:100%;object-fit:cover">`
      : (ICONS[p._iconSlug] || ICONS.box);
    document.getElementById("pm-name").textContent = p.name + (p.size ? ` (${p.size})` : "");
    document.getElementById("pm-desc").textContent = p.description || "";
    document.getElementById("pm-pieces").textContent = p.piecesPerCarton ? `عدد القطع في الكرتونة: ${p.piecesPerCarton} قطعة` : "";
    document.getElementById("pm-price").textContent = `${(Number(p.price) || 0).toFixed(2)} ج.م / الكرتونة`;
    document.getElementById("pm-qty").value = 1;
    document.getElementById("pm-msg").style.display = "none";
    document.getElementById("pm-add-btn").onclick = (e) => {
      const qty = parseInt(document.getElementById("pm-qty").value || "1");
      if (addToCart(p, qty)) {
        flashAddedState(e.currentTarget);
        flyToCart(e.currentTarget);
        setTimeout(closeProductModal, 600);
      } else if (typeof p.qty === "number") showStockMsg(document.getElementById("pm-msg"), p.qty);
    };
    document.getElementById("product-modal").style.display = "flex";
  };
  window.closeProductModal = function () {
    document.getElementById("product-modal").style.display = "none";
  };
  window.pmStepQty = function (delta) {
    const input = document.getElementById("pm-qty");
    const msg = document.getElementById("pm-msg");
    let v = Math.max(1, parseInt(input.value || "1") + delta);
    const stock = currentModalProduct && typeof currentModalProduct.qty === "number" ? currentModalProduct.qty : null;
    if (stock !== null && v > stock) { v = Math.max(1, stock); showStockMsg(msg, stock); }
    else msg.style.display = "none";
    input.value = v;
  };

  initSettings(() => initCategories(function () {
    const searchQuery = params.get("search");

    function iconFor(catSlug) {
      const c = CATEGORIES.find(x => x.slug === catSlug);
      return (c && ICONS[c.icon]) || ICONS.box;
    }

    function card(p, iconOverride, iconSlug) {
      const stockOk = (p.qty ?? 0) > 0;
      productsById[p.id] = { ...p, _iconSlug: iconSlug };
      return `
      <div class="prod-card">
        <div class="thumb" style="cursor:pointer" onclick="openProductModal(${escHtml(JSON.stringify(String(p.id)))})">${p.image ? `<img src="${escHtml(safeImg(p.image))}" alt="${escHtml(p.name)}">` : (iconOverride || iconFor(p.category))}</div>
        <div class="body">
          <h4 style="cursor:pointer" onclick="openProductModal(${escHtml(JSON.stringify(String(p.id)))})">${escHtml(p.name)}</h4>
          ${p.size ? `<div class="size-tag">${escHtml(p.size)}</div>` : ""}
          <span class="stock ${stockOk ? "" : "low"}">${stockOk ? "متوفر" : "غير متوفر حاليًا"}</span>
          <div class="add-row">
            <div class="qty-box">
              <button onclick="stepQty('${p.id}',-1)">−</button>
              <input id="q-${p.id}" value="1" readonly>
              <button onclick="stepQty('${p.id}',1)">+</button>
            </div>
            <button class="btn btn-amber" ${stockOk ? "" : "disabled"} onclick='addFromCard(${safeJson(p)}, this)'>أضف للسلة</button>
          </div>
          <div id="m-${p.id}" style="display:none;color:#e0455a;font-size:12.5px;margin-top:6px;font-weight:700"></div>
        </div>
      </div>`;
    }

    if (searchQuery) {
      mountHeader(null);
      mountFooter();
      document.title = `نتائج البحث عن "${searchQuery}" — SphinxPack`;
      document.getElementById("meta-description").setAttribute("content", `نتائج البحث عن ${searchQuery} في متجر سفينكس باك.`);
      document.getElementById("crumb-cat").textContent = "نتائج البحث";
      document.getElementById("cat-title").textContent = `نتائج البحث عن "${searchQuery}"`;
      document.getElementById("cat-desc").textContent = "كل المنتجات المطابقة لبحثك.";

      loadProducts(null, list => {
        const q = searchQuery.trim().toLowerCase();
        const filtered = list.filter(p => (p.name || "").toLowerCase().includes(q));
        if (!filtered.length) {
          grid.innerHTML = "";
          emptyNote.classList.remove("hidden");
          document.getElementById("empty-note").textContent = `مفيش منتجات مطابقة لـ "${searchQuery}"`;
          return;
        }
        emptyNote.classList.add("hidden");
        grid.innerHTML = filtered.map(p => card(p)).join("");
      });
      return;
    }

    const slug = params.get("cat") || CATEGORIES[0].slug;
    const cat = CATEGORIES.find(c => c.slug === slug) || CATEGORIES[0];

    mountHeader(cat.slug);
    mountFooter();

    document.title = `${cat.name} — SphinxPack`;
    document.getElementById("meta-description").setAttribute("content",
      `تصفح كل منتجات ${cat.name} بالجملة من سفينكس باك — أسعار جملة مناسبة للمطاعم والكافيهات وشركات الكاترينج، والطلب عبر واتساب.`);
    document.getElementById("crumb-cat").textContent = cat.name;
    document.getElementById("cat-title").textContent = cat.name;
    document.getElementById("cat-desc").textContent = cat.description || ("تصفح كل منتجات " + cat.name + " بالجملة.");

    loadProducts(cat.slug, list => {
      if (!list.length) {
        grid.innerHTML = "";
        emptyNote.classList.remove("hidden");
        return;
      }
      emptyNote.classList.add("hidden");
      grid.innerHTML = list.map(p => card(p, ICONS[cat.icon] || ICONS.box, cat.icon)).join("");
    });
  }));
</script>
<script>
  /* لو التحميل اتأخر جدًا نشيل الهياكل الرمادية بدل ما تفضل ظاهرة */
  setTimeout(function () {
    const g = document.getElementById("prod-grid");
    if (g && g.querySelector(".sk-card")) { g.innerHTML = ""; g.removeAttribute("aria-busy"); }
  }, 20000);
</script>
</body>
</html>
